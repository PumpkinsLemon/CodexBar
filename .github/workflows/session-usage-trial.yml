name: Codex reset credit expiry trial

on:
  push:
    branches: [codex/local-session-usage-trial]

permissions:
  contents: read

concurrency:
  group: session-usage-local-trial
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect Apple build tools
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
      - name: Run isolated production notifier tests
        run: |
          set -euo pipefail
          source Scripts/test_environment.sh
          node <<'JS'
          const fs = require('node:fs');
          const root = '.build/reminder-tests';
          for (const dir of ['Sources/CodexBarCore', 'Sources/CodexBar', 'Tests/ReminderTests']) fs.mkdirSync(root + '/' + dir, { recursive: true });
          const write = (p, s) => fs.writeFileSync(root + '/' + p, s);
          const read = p => fs.readFileSync(p, 'utf8');
          write('Package.swift', '// swift-tools-version: 6.2\nimport PackageDescription\nlet package = Package(name: "ReminderTests", platforms: [.macOS(.v14)], targets: [.target(name: "CodexBarCore"), .target(name: "CodexBar", dependencies: ["CodexBarCore"]), .testTarget(name: "ReminderTests", dependencies: ["CodexBar", "CodexBarCore"])])\n');
          write('Sources/CodexBarCore/CreditsModels.swift', read('Sources/CodexBarCore/CreditsModels.swift'));
          const formatter = read('Sources/CodexBarCore/UsageFormatter.swift');
          write('Sources/CodexBarCore/UsageFormatter.swift', formatter.slice(0, formatter.indexOf('    public static func resetLine(')) + '}\n');
          const grok = read('Sources/CodexBarCore/Providers/Grok/GrokRemainingResetsFetcher.swift');
          write('Sources/CodexBarCore/GrokSnapshot.swift', 'import Foundation\n' + grok.slice(grok.indexOf('public struct GrokRateLimitResetCreditsSnapshot:'), grok.indexOf('typealias GrokRemainingResetsLookup')));
          const view = read('Sources/CodexBar/Menu/MenuCardView+CodexResetCredits.swift');
          write('Sources/CodexBar/Presentation.swift', view.slice(0, view.indexOf('struct LimitResetCreditsContent:')));
          write('Sources/CodexBar/Notifier.swift', read('Sources/CodexBar/Providers/Codex/CodexResetCreditExpiryNotifier.swift'));
          write('Sources/CodexBar/Seams.swift', 'import Foundation\nfunc L(_ key: String) -> String { key }\n@MainActor final class AppNotifications { static let shared = AppNotifications(); func post(idPrefix: String, title: String, body: String) { fatalError("Real notification posting is disabled in tests") } }\n');
          const defaults = read('Tests/CodexBarTests/TestStores.swift');
          write('Tests/ReminderTests/InMemoryUserDefaults.swift', 'import Foundation\n' + defaults.slice(defaults.indexOf('final class InMemoryUserDefaults:'), defaults.indexOf('final class InMemoryCookieHeaderStore:')));
          write('Tests/ReminderTests/NotifierTests.swift', read('Tests/CodexBarTests/CodexResetCreditExpiryNotifierTests.swift'));
          JS
          swift test --package-path .build/reminder-tests --disable-sandbox
      - name: Package native trial
        env:
          ARCHES: arm64
          CODEXBAR_SIGNING: adhoc
        run: |
          set -euo pipefail
          source Scripts/test_environment.sh
          ./Scripts/package_app.sh release
      - name: Identify and archive trial
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Add :CodexBarTrialBuild bool true' CodexBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.82.0-reset-expiry-trial1' CodexBar.app/Contents/Info.plist
          codesign --force --sign - --preserve-metadata=entitlements CodexBar.app
          codesign --verify --deep --strict CodexBar.app
          mkdir -p trial
          ditto -c -k --keepParent CodexBar.app trial/CodexBar-reset-expiry-trial-arm64.zip
          shasum -a 256 trial/CodexBar-reset-expiry-trial-arm64.zip > trial/SHA256SUMS
          git rev-parse HEAD > trial/COMMIT
          git rev-parse HEAD^2 > trial/FEATURE_COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codexbar-reset-expiry-trial-arm64
          path: trial/
          retention-days: 7
          if-no-files-found: error
