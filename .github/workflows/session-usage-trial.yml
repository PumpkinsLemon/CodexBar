name: Session usage trial build

on:
  push:
    branches: [codex/local-session-usage-trial]

permissions:
  contents: read

concurrency:
  group: session-usage-local-trial
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Inspect Apple build tools
        run: |
          set -euo pipefail
          uname -m
          xcodebuild -version
          swift --version
          xcrun --show-sdk-version
      - name: Package native trial
        env:
          ARCHES: arm64
          CODEXBAR_SIGNING: adhoc
        run: |
          set -euo pipefail
          source Scripts/test_environment.sh
          ./Scripts/package_app.sh release
      - name: Identify and archive trial
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c 'Add :CodexBarTrialBuild bool true' CodexBar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Set :CFBundleShortVersionString 0.80.0-session-trial4' CodexBar.app/Contents/Info.plist
          codesign --force --sign - --preserve-metadata=entitlements CodexBar.app
          codesign --verify --deep --strict CodexBar.app
          mkdir -p trial
          ditto -c -k --keepParent CodexBar.app trial/CodexBar-session-trial-arm64.zip
          shasum -a 256 trial/CodexBar-session-trial-arm64.zip > trial/SHA256SUMS
          git rev-parse HEAD > trial/COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codexbar-session-trial-arm64
          path: trial/
          retention-days: 7
          if-no-files-found: error
